[project]
name = "erp-planner"
version = "0.1.0"
description = "Read an ERP database, infer what its tables mean, verify the result, and query it in plain English."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AZIZMOH9" }]
keywords = ["erp", "ontology", "odoo", "llm", "semantic-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.5",
    "anthropic>=1.3.0",
    "langchain-core>=1.6.1",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Repository = "https://github.com/AZIZMOH9/Erp_planner"
Issues = "https://github.com/AZIZMOH9/Erp_planner/issues"

[project.scripts]
erp-planner = "erp_planner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erp_planner"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is Option()/Argument() in parameter defaults.
"erp_planner/cli/*.py" = ["B008"]
